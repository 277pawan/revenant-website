<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07080b" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("revenant-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <title>Revenant — Prove your backups actually restore</title>
    <meta
      name="description"
      content="Disaster recovery proof for PostgreSQL. Free CLI, managed AWS restore drills, signed evidence vault."
    />

    <link rel="icon" type="image/svg+xml" href="/revenant_logo.svg" />

    <meta property="og:site_name" content="Revenant" />
    <meta property="og:title" content="Revenant — Prove your backups actually recover" />
    <meta
      property="og:description"
      content="Free CLI + cloud control plane. Managed AWS restore drills, evidence vault, real RTO."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://revenant.dev/" />
    <meta property="og:image" content="https://revenant.dev/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
